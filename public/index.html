<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTrack - Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,700">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css?family=Raleway:400,700');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Raleway, sans-serif;
        }

        body {
            background: linear-gradient(90deg, #C7C5F4, #776BCC);
            overflow: hidden;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            opacity: 0;
            /* GSAP will fade this in */
        }

        .screen {
            background: linear-gradient(90deg, #5D54A4, #7C78B8);
            position: relative;
            height: 600px;
            width: 360px;
            box-shadow: 0px 0px 24px #5C5696;
            border-radius: 20px;
            transform: translateY(-50px);
            /* Initial position for GSAP */
            opacity: 0;
        }

        .screen__content {
            z-index: 1;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login {
            width: 320px;
            padding: 30px;
        }

        .login__field {
            padding: 20px 0px;
            position: relative;
        }

        .login__icon {
            position: absolute;
            top: 30px;
            left: 5px;
            color: #7875B5;
            font-size: 20px;
        }

        .login__input {
            border: none;
            border-bottom: 2px solid #D1D1D4;
            background: none;
            padding: 10px;
            padding-left: 30px;
            font-weight: 700;
            width: 85%;
            transition: .2s;
        }

        h2 {
            color: white;
        }

        .login__input:focus {
            outline: none;
            border-bottom-color: #6A679E;
            transform: scale(1.05);
            /* Subtle scale effect */
        }

        login-title {
            font-size: 28px;
            /* Bigger font */
            font-weight: 800;
            /* Extra bold */
            background: linear-gradient(45deg, #ffffff, #ddddee);

            /* Gradient text effect */
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            /* Soft shadow */
            margin-bottom: 20px;
        }


        .login__submit {
            background: #fff;
            font-size: 14px;
            margin-top: 30px;
            padding: 16px 20px;
            border-radius: 26px;
            border: 1px solid #D4D3E8;
            text-transform: uppercase;
            font-weight: 700;
            display: flex;
            align-items: center;
            width: 100%;
            color: #4C489D;
            box-shadow: 0px 2px 2px #5C5696;
            cursor: pointer;
            transition: .2s;
            justify-content: center;
        }

        .login__submit:hover {
            background: #6A679E;
            color: #fff;
            border-color: #6A679E;
        }

        .button__icon {
            font-size: 20px;
            margin-left: 10px;
            color: #7875B5;
        }

        #login-error {
            color: #ff4f4f;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="screen">
            <div class="screen__content">
                <h2 class="login-title">TapTrack Admin Login</h2>

                <div class="login">
                    <div class="login__field">
                        <i class="fas fa-user login__icon"></i>
                        <input type="text" id="username" placeholder="Username" class="login__input" required>
                    </div>

                    <div class="login__field">
                        <i class="fas fa-lock login__icon"></i>
                        <input type="password" id="password" placeholder="Password" class="login__input" required
                            onkeypress="handleKeyPress(event)">
                    </div>

                    <button onclick="login()" class="login__submit">
                        Login
                        <i class="fas fa-sign-in-alt button__icon"></i>
                    </button>

                    <p id="login-error"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GSAP Animations
        gsap.to(".container", { opacity: 1, duration: 1 });
        gsap.to(".screen", { opacity: 1, y: 0, duration: 1, ease: "bounce.out" });

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('login-error');
            const loginButton = document.querySelector(".login__submit");

            if (!username || !password) {
                errorMsg.innerText = "⚠️ Username and password are required!";
                gsap.to(".screen", { x: -10, yoyo: true, repeat: 5, duration: 0.1 }); // Shake effect
                return;
            }

            errorMsg.innerText = "🔄 Logging in...";
            loginButton.disabled = true;
            gsap.to(loginButton, { scale: 0.95, duration: 0.2 });

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    gsap.to(".screen", {
                        scale: 1.1, duration: 0.5, ease: "power2.out", onComplete: () => {
                            localStorage.setItem('token', data.token);
                            window.location.href = 'dashboard.html';
                        }
                    });
                } else {
                    errorMsg.innerText = "❌ " + data.message;
                    gsap.to(".screen", { x: -10, yoyo: true, repeat: 5, duration: 0.1 }); // Shake effect
                    loginButton.disabled = false;
                }
            } catch (error) {
                errorMsg.innerText = "❌ Server error. Please try again later.";
                gsap.to(".screen", { x: -10, yoyo: true, repeat: 5, duration: 0.1 }); // Shake effect
                loginButton.disabled = false;
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                login();
            }
        }
    </script>

</body>

</html>
